<!-- Second Visuals — логотип 3 «Піксельна S із тінню».
     Кутаста «цифрова» S, як у піксельних шрифтах Minecraft, з закругленими кутами.
     Позаду — та сама S м'ятного кольору, зміщена по діагоналі: «друга» копія, відлуння. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="18" fill="#15111F"/>
  <g fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <!-- тінь-відлуння (м'ятна) -->
    <path d="M47.5 16 H20.5 V34 H47.5 V52 H20.5" stroke="#5EE6C8"/>
    <!-- основна S (тепла біла) -->
    <path d="M43.5 12 H16.5 V30 H43.5 V48 H16.5" stroke="#F3E9E1"/>
  </g>
</svg>
